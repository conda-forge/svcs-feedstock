{% set name = "svcs" %}
{% set version = "26.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/svcs-{{ version }}.tar.gz
  sha256: 129efb89586c2c52295ee00b00562af7d85d5535dad149534993e25fccbd76a6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling >=1.27.0
    - hatch-vcs
    - hatch-fancy-pypi-readme
    - pip
  run:
    - python >={{ python_min }}
    - attrs >=21.3.0
    - typing_extensions >=4.13.0

test:
  imports:
    - svcs
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: A Flexible Service Locator
  license: MIT
  license_file: LICENSE
  home: https://svcs.hynek.me/en/stable/index.html

extra:
  recipe-maintainers:
    - tdsmith
